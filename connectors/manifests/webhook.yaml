key: webhook
version: 1.0.0
tier: bridge
auth: hmac_sha256
surfaces:
  - key: payload
    content_types:
      - json
      - text
      - media_link
    spec:
      body_max_chars: 65536
      links_allowed: true
rate_limits:
  per_connection:
    requests: 120
    per_seconds: 60
capabilities:
  - publish
  - status
  - delete
error_map:
  "401": CONNECTION_AUTH_EXPIRED
  "403": CONNECTION_AUTH_EXPIRED
  "422": PLATFORM_CONTENT_REJECTED
  "429": PLATFORM_RATE_LIMIT
  "500": PLATFORM_UNAVAILABLE
  "503": PLATFORM_UNAVAILABLE
instance_param: webhook_url
