key: hashnode
version: 1.0.0
tier: native
auth: api_key
surfaces:
  - key: article
    content_types:
      - text
      - markdown
      - code
      - image
    spec:
      title_max_chars: 250
      body_max_chars: 100000
      max_tags: 5
      links_allowed: true
rate_limits:
  per_connection:
    requests: 60
    per_seconds: 60
capabilities:
  - publish
  - status
  - delete
  - metrics
error_map:
  "401": CONNECTION_AUTH_EXPIRED
  "403": CONNECTION_AUTH_EXPIRED
  "422": PLATFORM_CONTENT_REJECTED
  "429": PLATFORM_RATE_LIMIT
  "500": PLATFORM_UNAVAILABLE
  "503": PLATFORM_UNAVAILABLE
instance_param: publication_id
