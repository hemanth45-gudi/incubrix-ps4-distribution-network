key: lemmy
version: 1.0.0
tier: protocol
auth: bearer_token
surfaces:
  - key: post
    content_types:
      - text
      - link
      - image
    spec:
      title_max_chars: 200
      body_max_chars: 10000
      links_allowed: true
rate_limits:
  per_connection:
    requests: 30
    per_seconds: 60
capabilities:
  - publish
  - status
  - delete
  - metrics
error_map:
  "401": CONNECTION_AUTH_EXPIRED
  "403": CONNECTION_AUTH_EXPIRED
  "400": PLATFORM_CONTENT_REJECTED
  "422": PLATFORM_CONTENT_REJECTED
  "429": PLATFORM_RATE_LIMIT
  "500": PLATFORM_UNAVAILABLE
  "503": PLATFORM_UNAVAILABLE
instance_param: base_url
