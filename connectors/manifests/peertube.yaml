key: peertube
version: 1.0.0
tier: protocol
auth: bearer_token
surfaces:
  - key: video_post
    content_types:
      - text
      - video_link
      - image
    spec:
      title_max_chars: 120
      body_max_chars: 50000
      max_tags: 5
      links_allowed: true
rate_limits:
  per_connection:
    requests: 30
    per_seconds: 60
capabilities:
  - publish
  - status
  - delete
  - metrics
error_map:
  "401": CONNECTION_AUTH_EXPIRED
  "403": CONNECTION_AUTH_EXPIRED
  "422": PLATFORM_CONTENT_REJECTED
  "429": PLATFORM_RATE_LIMIT
  "500": PLATFORM_UNAVAILABLE
instance_param: base_url
